name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Typecheck
        run: pnpm -C packages/template typecheck

      - name: Lint
        run: pnpm -C packages/template lint

      - name: Lint architecture (Feature-Sliced Design)
        run: pnpm -C packages/template lint:fsd

      - name: Check formatting
        run: pnpm -C packages/template format

      - name: Unit and integration tests
        run: pnpm -C packages/template test

      - name: Build
        run: pnpm -C packages/template build

      - name: Build Storybook
        run: pnpm -C packages/template build-storybook --quiet

      - name: CLI tests
        run: pnpm -C packages/cli test

  generated:
    name: Generated project (${{ matrix.template }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        template: [full, minimal, blank]
    # Outside the checkout, so pnpm treats the project as standalone, not as part
    # of this repository's workspace. (`runner.temp` is not allowed in `defaults`.)
    defaults:
      run:
        working-directory: /tmp/app
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create project with the CLI
        working-directory: /tmp
        run: node "$GITHUB_WORKSPACE/packages/cli/bin/index.js" app --template ${{ matrix.template }}

      - name: Install dependencies
        run: |
          git init --quiet
          pnpm install --no-frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Static checks and tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm -C packages/template exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm -C packages/template test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/template/playwright-report
          retention-days: 7
