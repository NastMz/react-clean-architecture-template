name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 0.1.0 or v0.1.0'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-cli:
    name: Publish @nastmz/create-react-starter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No dependency cache in release builds, so a poisoned cache cannot reach the package.
          package-manager-cache: false

      # Staged publishing needs npm 11.15 or later; the npm bundled with Node may be older.
      - name: Update npm
        run: npm install --global npm@12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            raw_version="${{ github.event.release.tag_name }}"
          else
            raw_version="${{ inputs.version }}"
          fi

          version="${raw_version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Apply package version
        working-directory: packages/cli
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      # The version lands in npm's staging area; a maintainer approves it with 2FA
      # (npm stage approve <id>, or npmjs.com > Staged Packages) before it goes live.
      - name: Stage package
        working-directory: packages/cli
        run: npm stage publish --access public --provenance
